 <script src="/socket.io/socket.io.js"></script>
<script>


    // 生成或读取设备唯一标识（UUID）
  let deviceId = localStorage.getItem('deviceId');
  if (!deviceId) {
   const min = 10000000; // 最小8位数字
  const max = 99999999; // 最大8位数字
  const randomNum = Math.floor(Math.random() * (max - min + 1)) + min;
  deviceId = randomNum.toString(); // 转换为字符串
    localStorage.setItem('deviceId', deviceId);
  }

  // 读取或设置用户昵称
let nickname = localStorage.getItem('nickname');
    while (!nickname || nickname.trim() === '') {
      nickname = prompt('请输入您的昵称：').trim();
      if (!nickname) {
        alert('昵称不能为空，请重新输入！');
      }
    }
    localStorage.setItem('nickname', nickname); // 保存昵称到本地存储


    // 渲染右上角昵称显示
function renderNickname() {
  // 先移除已存在的显示元素（避免重复）
  const existing = document.getElementById('nicknameDisplay');
  if (existing) existing.remove();

// 创建新的容器元素，包含头像和昵称
  const container = document.createElement('div');
  container.id = 'nicknameDisplay';
  container.style.display = 'flex';
  container.style.alignItems = 'center';
  
 // 创建头像
  const avatar = document.createElement('div');
  const firstChar = getFirstChar(nickname);
  const avatarColor = getAvatarColor(deviceId);
  avatar.className = 'avatar';
  avatar.style.backgroundColor = avatarColor;
  avatar.textContent = firstChar;
  
  // 创建昵称文本
  const nicknameText = document.createElement('span');
  nicknameText.textContent = nickname;
  nicknameText.style.marginLeft = '8px'; // 头像和昵称之间的间距
  
  // 组装容器
  container.appendChild(avatar);
  container.appendChild(nicknameText);
  document.body.appendChild(container); // 添加到页面
}

  //更改昵称
    document.getElementById('changeNickname').addEventListener('click', () => {
  const newNickname = prompt('请输入新的昵称：', nickname).trim();
  if (newNickname && newNickname !== nickname) {
    const oldNickname = nickname; // 保存旧昵称
    nickname = newNickname;
    localStorage.setItem('nickname', nickname);
    alert('昵称已更新为：' + nickname);
     document.getElementById('currentNickname').textContent = ` ${nickname}`;
     renderNickname();
    // 向服务器发送昵称修改通知
    socket.emit('nickname changed', {
      oldNickname: oldNickname,
      newNickname: newNickname,
      deviceId: deviceId // 用于标识唯一用户
    });
  } else if (!newNickname) {
    alert('昵称不能为空！');
  }
});

renderNickname();
  // 获取设备基础信息（浏览器/系统）
  const deviceInfo = {
    deviceId: deviceId,
    nickname:nickname,
    userAgent: navigator.userAgent, // 浏览器标识
    platform: navigator.platform    // 系统平台
  };

// 生成头像背景色
function getAvatarColor(str) {
  // 根据字符串生成哈希值
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = str.charCodeAt(i) + ((hash << 5) - hash);
  }
  // 转换哈希值为RGB颜色
  const c = (hash & 0x00FFFFFF)
    .toString(16)
    .toUpperCase();
  // 补全6位
  return '#' + '00000'.substring(0, 6 - c.length) + c;
}
// 获取昵称首字符
function getFirstChar(nickname) {
  if (!nickname) return '';
  // 中文取第一个字符，英文取首字母大写
  return nickname.charAt(0).toUpperCase();
}




 const socket = io();
 const form = document.getElementById('form');
 const input = document.getElementById('input');
 const messages = document.getElementById('messages');

 socket.on('connect', () => {
    socket.emit('user connected', {
      nickname: nickname
    });
  });
 form.addEventListener('submit', (e) => {
 e.preventDefault();
 if (input.value) // 发送消息时携带deviceId
      socket.emit('chat message', 
      {
        text: input.value,
        deviceId: deviceId ,
        nickname:nickname
      });
      input.value = '';
 });

 socket.on('chat message', (msg) => {
    const item = document.createElement('li');
    if (msg.type === 'system') {
      // 系统消息样式（灰色、斜体）
        item.className = 'system-message'; // 添加类名
      item.innerHTML = `
        <span class="system-time">[${msg.time}]</span>
        <span class="system-content">${msg.content}</span>
      `;
      item.style.color = '#666';
      item.style.fontStyle = 'italic';
    } else {
      // 普通消息样式（头像+昵称+内容）
      const avatarColor = getAvatarColor(msg.deviceId); // 基于deviceId生成固定颜色
const firstChar = getFirstChar(msg.nickname);
     item.innerHTML = `
      <div class="message-container">
         <div class="avatar" style="background-color: ${avatarColor}">${firstChar}</div>
        <span class="nickname">${msg.nickname}</span>
        <span class="message-text">(${msg.deviceId})[${msg.ip}]: ${msg.text}</span>
        <span class="message-time">${msg.time}</span>
      </div>
    `;
  }
    messages.appendChild(item);
    window.scrollTo(0, document.body.scrollHeight);
  });


// 用户列表相关变量
let userList = {
  online: [],
  offline: []
};
// 初始化用户列表监听
function initUserSystem() {
  // 监听用户列表更新
  socket.on('update user list', (updatedList) => {
    userList = updatedList;
    renderUserLists();
  });
  // 发送当前用户信息到服务器
  socket.emit('register user', {
    deviceId: deviceId,
    nickname: nickname,
    status: 'online'
  });
}
// 渲染用户列表
function renderUserLists() {
  // 渲染在线用户前先去重
const uniqueOnlineUsers = Array.from(new Map(
  userList.online.map(user => [user.deviceId, user])
).values());
// 渲染离线用户前先去重
const uniqueOfflineUsers = Array.from(new Map(
  userList.offline.map(user => [user.deviceId, user])
).values());
  const onlineContainer = document.getElementById('onlineUsers');
  const offlineContainer = document.getElementById('offlineUsers');
  onlineContainer.innerHTML = '';
  offlineContainer.innerHTML = '';
  // 渲染在线用户
  userList.online.forEach(user => {
    const item = document.createElement('div');
    item.className = 'user-item';
    item.innerHTML = `
      <div class="status-indicator status-online"></div>
      <span>${user.nickname}</span>
    `;
    onlineContainer.appendChild(item);
  });
  // 渲染离线用户
  userList.offline.forEach(user => {
    if (user.deviceId === deviceId) return; // 跳过自己
    const item = document.createElement('div');
    item.className = 'user-item';
    item.innerHTML = `
      <div class="status-indicator status-offline"></div>
      <span>${user.nickname}</span>
    `;
    offlineContainer.appendChild(item);
  });
}
// 移动端用户列表切换
  const toggleBtn = document.querySelector('.toggle-user-list');
  const userListContainer = document.querySelector('.user-list-container');
  toggleBtn.addEventListener('click', () => {
    userListContainer.classList.toggle('show');
  });
  // 点击消息区域自动隐藏用户列表（移动端）
  const mainContent = document.querySelector('.main-content');
  mainContent.addEventListener('click', () => {
    if (window.innerWidth <= 768 && userListContainer.classList.contains('show')) {
      userListContainer.classList.remove('show');
    }
  });
// 页面加载完成后初始化用户系统
window.addEventListener('load', () => {
  initUserSystem();
});
</script>
